{% extends "core/base.html" %}

{% block title %} {{title}} {% endblock %}

{% block content %}
<h1 class="mb-6 text-3xl font-bold">{{title}}</h1>
<form method="post" action="." enctype="multipart/form-data">
    {% csrf_token %}
    <div class="space-y-4">
        {{form.as_p}}
    </div>
        {% if form.errors %}
            <div class="mb-3 p-6 bg-red-100 text-red-700 rounded-xl">
                {% for field in form %}
                    {% for error in field.errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                {% endfor %}
            </div>
        {% endif %}

        <button type="submit" class=" mt-6 py-4 px-6 bg-teal-500 text-white rounded-xl hover:bg-teal-700"> Submit </button>
</form>
{% endblock %}
